# =====================================================================
# Tracker d'offres de stage : banque / finance de marché / asset management
# Tu ne modifies que ce fichier. Teste une source :
#   python -m tracker.check config "Barclays"
# =====================================================================

filters:
  # Contrat : au moins un de ces mots dans le titre ou la carte de l'offre
  # (ignoré pour les sources marquées all_internships: true)
  contract_keywords: [stage, stagiaire, intern, internship, "off-cycle", "off cycle", césure, cesure, "gap year", trainee, placement, "summer analyst", praktik, becari, stagiair]

  # Sujet : au moins un de ces mots dans le titre ou la carte (entité, métier...)
  topic_keywords:
    - sales
    - trading
    - trader
    - structur          # structuring, structured, structureur, structuré
    - derivative
    - dérivé
    - "fixed income"
    - equity
    - equities
    - "rates"
    - " fx"
    - forex
    - commodit
    - "markets"
    - "marchés"
    - "front office"
    - "asset management"
    - "gestion d'actifs"
    - "gestion de portefeuille"
    - "portfolio"
    - "fund"
    - "investment"
    - "wealth"
    - "banque privée"
    - "private bank"
    - "capital markets"
    - "quant"
    - "market making"
    - "research"
    - "repo"
    - "money market"
    - "multi-asset"
    - "cross-asset"
    - "product specialist"
    - "investment banking"
    - "m&a"
    # Entités asset management / banque privée : toutes leurs offres de stage passent
    - amundi
    - indosuez
    - "cpr am"
    - "bnp paribas asset management"
    - "bnp paribas wealth management"

  # Un de ces mots dans le TITRE = offre ignorée
  exclude_keywords: [senior, director, "vice president", "managing director", audit, comptab, accounting, juridique, juriste, legal, "ressources humaines", " rh ", "human resources", recrutement, "talent acquisition", développeur, developer, devops, "software", "conseiller clientèle", "conseil aux particuliers", "conseil marché", communication, marketing, achats, procurement, fiscal]

  # Localisation (mot entier, cherché dans la carte de l'offre). Vide = partout.
  locations: [paris, amsterdam, "la defense", "la défense", puteaux, courbevoie, montrouge, "île-de-france", "ile-de-france", monaco, "monte-carlo", london, londres, genève, geneva, zurich, luxembourg, nice, sophia, lyon, france]

telegram:
  max_detailed: 10

# =====================================================================
# SOURCES
#   [vérifié]  = structure lue sur le site le 05/10/2026
#   [à tester] = identifiant connu mais pas testé depuis ici :
#                lance `python -m tracker.check config "Nom"` avant de compter dessus
# =====================================================================
sources:
  html_links:
    # BNP Paribas : désactivé. group.bnpparibas bloque les serveurs GitHub (403) et le
    # portail bwelcome.hr.bnpparibas n'a pas de liste publique (404).
    # -> utiliser l'alerte e-mail officielle sur la page des stages BNP.

    # [vérifié] une page = les 400 offres les plus récentes (tous contrats)
    - company: "Société Générale"
      url: "https://careers.societegenerale.com/fr/Technical/toutes-les-offres"
      link_contains: "/offres-d-emploi/"
      pages: 1

    # [vérifié] CA CIB, Amundi, Indosuez, CACEIS, LCL : ~33 offres/page
    - company: "Crédit Agricole / Amundi"
      url: "https://groupecreditagricole.jobs/fr/nos-offres/"
      page_url: "https://groupecreditagricole.jobs/fr/nos-offres/page/{page}/"
      link_contains: "/nos-offres-emploi/"
      pages: 3

    # [vérifié] toutes les offres Citi à Paris
    - company: "Citi"
      url: "https://jobs.citi.com/location/paris-jobs/287/3017382-3012874-2988507/4"
      link_contains: "/job/"
      pages: 1

    # [à tester] portails Oleeo (liste HTML, liens /opp/)
    - company: "Morgan Stanley"
      url: "https://morganstanley.tal.net/vx/lang-en-GB/mobile-0/brand-2/xf-53515a97a3a0/candidate/jobboard/vacancy/1/adv"
      link_contains: "/opp/"
      id_regex: '/opp/([0-9]+)'
      pages: 1
    - company: "Lazard"   # [à tester]
      url: "https://lazard-careers.tal.net/vx/lang-en-GB/mobile-0/brand-4/xf-a4bba4c3553c/candidate/jobboard/vacancy/2/adv"
      link_contains: "/opp/"
      id_regex: '/opp/([0-9]+)'
      pages: 1

    # [vérifié] Kepler Cheuvreux (Teamtailor) : broker actions, structuration, fixed income
    - company: "Kepler Cheuvreux"
      url: "https://keplercheuvreux.teamtailor.com/jobs"
      link_contains: "/jobs/"
      link_regex: '/jobs/[0-9]+'
      id_regex: '/jobs/([0-9]+)'
      pages: 1

    # [à tester] Pictet (SAP SuccessFactors) : la page de liste peut nécessiter JavaScript
    - company: "Pictet"
      url: "https://career5.successfactors.eu/career?company=banquepict&career_ns=job_listing_summary&navBarLevel=JOB_SEARCH"
      link_contains: "career_job_req_id"
      id_regex: 'career_job_req_id=([0-9]+)'
      pages: 1

    - company: "Evercore"
      url: "https://evercore.tal.net/vx/lang-en-GB/mobile-0/appcentre-1/brand-6/candidate/jobboard/vacancy/1/adv"
      link_contains: "/opp/"
      id_regex: '/opp/([0-9]+)'
      pages: 1

