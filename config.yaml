# =====================================================================
# Tracker d'offres de stage : banque / finance de marché / asset management
# Tu ne modifies que ce fichier. Teste une source :
#   python -m tracker.check config "Barclays"
# =====================================================================

filters:
  # MODE MAXIMUM : seul le contrat (stage) est filtré.
  # Contrat : au moins un de ces MOTS ENTIERS dans le titre ou la carte de l'offre
  # ("intern" ne matche pas "internal audit" ; un mot terminé par * est un préfixe : "praktik*")
  # (ignoré pour les sources marquées all_internships: true)
  contract_keywords: [stage, stagiaire, intern, internship, "off-cycle", "off cycle", césure, cesure, "gap year", trainee, placement, "summer analyst", "summer associate", "praktik*", "becari*", "stagiair*", "werkstudent*", "working student", bachelorstage, masterstage, meewerkstage, afstudeerstage, stageplaats]

  # Sujet : vide = tous les stages passent.
  # Pour revenir au mode "front office", remets par exemple :
  # [sales, trading, structur, derivative, "fixed income", equity, markets, "asset management", portfolio, fund, investment, wealth, quant, "m&a"]
  topic_keywords: []

  # Exclusions (titre uniquement) : postes seniors et métiers sans lien avec la finance
  exclude_keywords: [senior, director, "vice president", "managing director", "ressources humaines", " rh ", "human resources", recrutement, "talent acquisition", juridique, juriste, legal, marketing, communication, développeur, developer, devops, software, achats, procurement, "conseiller clientèle", "conseil aux particuliers"]

  # Lieu : vide = monde entier.
  # Pour revenir à l'Europe, remets par exemple :
  # [paris, "la defense", "île-de-france", france, monaco, london, genève, geneva, zurich, suisse, luxembourg, amsterdam]
  locations: []

telegram:
  max_detailed: 10

# =====================================================================
# SOURCES
#   [vérifié]  = structure lue sur le site le 05/10/2026
#   [à tester] = identifiant connu mais pas testé depuis ici :
#                lance `python -m tracker.check config "Nom"` avant de compter dessus
# =====================================================================
sources:
  html_links:
    # BNP Paribas : désactivé. group.bnpparibas bloque les serveurs GitHub (403) et le
    # portail bwelcome.hr.bnpparibas n'a pas de liste publique (404).
    # -> utiliser l'alerte e-mail officielle sur la page des stages BNP.

    # [vérifié] une page = les 400 offres les plus récentes (tous contrats)
    - company: "Société Générale"
      url: "https://careers.societegenerale.com/fr/Technical/toutes-les-offres"
      link_contains: "/offres-d-emploi/"
      pages: 1

    # [vérifié 08/10] Site carrière du groupe entier (CA CIB, Amundi, Indosuez, CACEIS, LCL, Assurances...) :
    # 1196 offres sur 38 pages (~33 par page), dont ~174 stages. L'ancien réglage (3 pages) n'en lisait que 8 %.
    - company: "Crédit Agricole / Amundi"
      url: "https://groupecreditagricole.jobs/fr/nos-offres/"
      page_url: "https://groupecreditagricole.jobs/fr/nos-offres/page/{page}/"
      link_contains: "/nos-offres-emploi/"
      pages: 45
      recent_pages: 3   # mode rapide : les 3 premières pages (~100 offres les plus récentes) à chaque passage
      seed: 2   # portée passée de 3 à 38 pages : on réinitialise la source en silence (sinon ~140 fausses « nouvelles offres »)

    # [vérifié] toutes les offres Citi à Paris
    - company: "Citi"
      url: "https://jobs.citi.com/location/paris-jobs/287/3017382-3012874-2988507/4"
      link_contains: "/job/"
      pages: 1

    # [à tester] portails Oleeo (liste HTML, liens /opp/)
    - company: "Morgan Stanley"
      url: "https://morganstanley.tal.net/vx/lang-en-GB/mobile-0/brand-2/xf-53515a97a3a0/candidate/jobboard/vacancy/1/adv"
      link_contains: "/opp/"
      id_regex: '/opp/([0-9]+)'
      pages: 1
    # [vérifié] Kepler Cheuvreux (Teamtailor) : broker actions, structuration, fixed income
    - company: "Kepler Cheuvreux"
      url: "https://keplercheuvreux.teamtailor.com/jobs"
      link_contains: "/jobs/"
      link_regex: '/jobs/[0-9]+'
      id_regex: '/jobs/([0-9]+)'
      pages: 1

    # [à tester] IMC : page publique Greenhouse Europe
    - company: "IMC Trading"
      url: "https://job-boards.eu.greenhouse.io/imc"
      link_contains: "/jobs/"
      link_regex: '/imc/jobs/[0-9]+'
      id_regex: '/jobs/([0-9]+)'
      pages: 1

    - company: "Evercore"
      url: "https://evercore.tal.net/vx/lang-en-GB/mobile-0/appcentre-1/brand-6/candidate/jobboard/vacancy/1/adv"
      link_contains: "/opp/"
      id_regex: '/opp/([0-9]+)'
      pages: 1

    # [à tester] BNP Paribas : Akamai bloque python-requests -> empreinte TLS de navigateur (curl_cffi).
    # Une carte = une offre ; ~10 offres par page, ~28 pages de stages.
    - company: "BNP Paribas"
      url: "https://group.bnpparibas/emploi-carriere/toutes-offres-emploi/stage"
      link_contains: "/emploi-carriere/offre-emploi/"
      id_regex: '/offre-emploi/([^/?#]+)'
      impersonate: "chrome124"
      all_internships: true
      pages: 35
      recent_pages: 3

    # [vérifié] Oddo BHF : portail altays (le même que la page « Découvrez nos offres »), 237 offres, liste HTML paginée (?page=N)
    - company: "Oddo BHF"
      url: "https://recrutement.altays-progiciels.com/oddo/fr/offres.html"
      link_contains: "/oddo/fr/offres/"
      link_regex: '-[0-9]+\.html'
      id_regex: '-([0-9]+)\.html'
      strip_query: true
      page_param: "page"
      pages: 30   # pas de recent_pages : la liste Oddo n'est pas triée par date, on lit tout (24 petites pages)

