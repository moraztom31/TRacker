name: probe
# Outil de test des sources depuis un runner GitHub (accès réseau libre).
on:
  workflow_dispatch:
  push:
    branches: ["claude/github-repository-access-aoguba"]
    paths: ["tools/probe/**", ".github/workflows/probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install playwright
      - name: Nouvelles sources (collecteurs reels)
        run: |
          for n in HSBC AXA "Edmond" Vanguard Neuberger BMO CIBC "S&P" LSEG Lloyds Rabobank Millennium BBVA abrdn Guggenheim "Raymond" "Morgan Stanley" AQR Virtu "William Blair" "Jane Street" GSA Winton "Legal"; do
            python -m tracker.check config "$n" 2>&1 | grep -E "^\[" || true
          done
      - name: Tour 4
        run: |
          playwright install --with-deps chromium >/dev/null 2>&1
          python tools/probe/round4.py 2>&1
