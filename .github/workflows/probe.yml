name: probe
# Outil de test des sources depuis un runner GitHub (accès réseau libre).
on:
  workflow_dispatch:
  push:
    branches: ["claude/github-repository-access-aoguba"]
    paths: ["tools/probe/**", ".github/workflows/probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Etat des sources actuelles
        run: python -m tracker.check config "" 2>&1 | grep -E "^\[" || true
      - name: ATS
        run: python tools/probe/ats.py 2>&1
      - name: Sites bloques
        run: python tools/probe/sites.py 2>&1
