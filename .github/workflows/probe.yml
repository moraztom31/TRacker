name: probe
# Outil de test des sources depuis un runner GitHub (accès réseau libre).
on:
  workflow_dispatch:
  push:
    branches: ["claude/github-repository-access-aoguba"]
    paths: ["tools/probe/**", ".github/workflows/probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install curl_cffi playwright
      - name: Tour 2
        run: python tools/probe/round2.py 2>&1
      - name: Navigateur
        run: |
          playwright install --with-deps chromium >/dev/null 2>&1
          python tools/probe/browse.py 2>&1
