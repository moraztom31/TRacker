name: probe
# Outil de test des sources depuis un runner GitHub (accès réseau libre).
on:
  workflow_dispatch:
  push:
    branches: ["claude/github-repository-access-aoguba"]
    paths: ["tools/probe/**", ".github/workflows/probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Nouvelles sources (collecteurs reels)
        run: |
          for n in Oddo Natixis; do
            python -m tracker.check config "$n" 2>&1 | head -14
          done
      - name: Tour 5
        run: python tools/probe/round5.py 2>&1
