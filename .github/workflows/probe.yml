name: probe
# Outil de test des sources depuis un runner GitHub (accès réseau libre).
on:
  workflow_dispatch:
  push:
    branches: ["claude/github-repository-access-aoguba"]
    paths: ["tools/probe/**", ".github/workflows/probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tour 14 ordre de tri
        run: python tools/probe/round14.py 2>&1
      - name: Scan complet puis rapide
        run: |
          TRACKER_FULL=1 python -m tracker.main 2>&1 | grep -E "Oddo|Cr.dit Agricole|BNP|Groupe BPCE|UBS|KO|sources,"
          echo ---- scan rapide ----
          TRACKER_FULL=0 python -m tracker.main 2>&1 | grep -E "Oddo|Cr.dit Agricole|BNP|Groupe BPCE|UBS|KO|sources,"
